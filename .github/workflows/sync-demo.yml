name: Sync demo to docs
on:
  push:
    branches: [main]
    paths:
      - 'demos/hebbian-kuramoto.html'
      - 'demos/coordination-kernel.html'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp demos/hebbian-kuramoto.html docs/index.html
      - run: cp demos/hebbian-kuramoto.html docs/hebbian-kuramoto.html
      - run: cp demos/coordination-kernel.html docs/coordination-kernel.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: sync demos to docs/ (hebbian index + coordination kernel)"
